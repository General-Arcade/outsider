name: Probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build and run the mkdir probe
        shell: cmd
        run: |
          echo CD=%CD%
          echo TEMP=%TEMP%
          cl /nologo /W3 .github\probe\mkdir_probe.c /Fe:probe.exe
          echo ==================== PROBE ====================
          probe.exe
